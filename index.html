<title>下载中心</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --card:#181b22; --line:#2a2f3a;
          --fg:#e8eaed; --muted:#9aa4b2; --accent:#4f8cff; --ok:#2fbf71; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); padding:24px;
         font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; }
  .card { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line);
          border-radius:16px; padding:32px; }
  h1 { margin:0 0 8px; font-size:22px; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:8px; }
  input { width:100%; padding:12px 14px; background:#0d1017; color:var(--fg);
          border:1px solid var(--line); border-radius:10px; font-size:16px;
          font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
          letter-spacing:.08em; text-transform:uppercase; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:16px; padding:13px; background:var(--accent); color:#fff;
           border:0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:16px; padding:14px; border-radius:10px; font-size:14px; display:none; }
  .msg.show { display:block; }
  .msg.ok { background:rgba(47,191,113,.12); border:1px solid rgba(47,191,113,.4); }
  .msg.bad { background:rgba(255,92,92,.1); border:1px solid rgba(255,92,92,.4); }
  a.dl { display:block; margin-top:12px; padding:14px; text-align:center; background:var(--ok);
         color:#fff; border-radius:10px; text-decoration:none; font-weight:600; }
  .hint { color:var(--muted); font-size:12px; margin-top:10px; }
</style>

// 所以这里只能用浏览器和 Node 都有的 API（WebCrypto / TextEncoder / atob / btoa），
// 并且不能出现 export 以外的新语法，也不能用模板字符串。

const KDF_ITERATIONS = 50000;
const ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

function normalizeCode(raw) {
  if (typeof raw !== 'string') return null;
  let out = '';
  const cleaned = raw.toUpperCase().replace(/[^0-9A-Z]/g, '');
  for (let i = 0; i < cleaned.length; i++) {
    const ch = cleaned[i];
    const mapped = ch === 'O' ? '0' : (ch === 'I' || ch === 'L') ? '1' : ch;
    if (ALPHABET.indexOf(mapped) < 0) return null;
    out += mapped;
  }
  return out.length ? out : null;
}

function toB64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromB64u(str) {
  const s = atob(String(str).replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

async function sha256Hex(input) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
  const bytes = new Uint8Array(buf);
  let out = '';
  for (let i = 0; i < bytes.length; i++) out += bytes[i].toString(16).padStart(2, '0');
  return out;
}

// 兑换码本身有 80 位随机熵，不需要靠迭代次数抗爆破；这里只是让每次派生都带上
// 独立盐，避免同一链接在不同条目间出现相同密文。
async function deriveKey(code, salt, usage) {
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey'],
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: KDF_ITERATIONS, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    [usage],
  );
}

async function encryptPayload(code, payload) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(code, salt, 'encrypt');
  const ct = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(payload)),
  );
  return { s: toB64u(salt), i: toB64u(iv), c: toB64u(new Uint8Array(ct)) };
}

// 密码不对时 AES-GCM 的认证会失败并抛错，所以这一个函数同时承担
// “码不存在”和“码不对”两种判断，返回 null。
async function decryptPayload(code, blob) {
  try {
    const key = await deriveKey(code, fromB64u(blob.s), 'decrypt');
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: fromB64u(blob.i) }, key, fromB64u(blob.c),
    );
    return JSON.parse(new TextDecoder().decode(pt));
  } catch {
    return null;
  }
}


(async () => {
  const BLOBS = JSON.parse(document.getElementById('data').textContent);
  const f = document.getElementById('f');
  const b = document.getElementById('b');
  const m = document.getElementById('m');
  const i = document.getElementById('code');

  i.addEventListener('input', () => {
    const v = i.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 16);
    i.value = v.replace(/(.{4})/g, '$1-').replace(/-$/, '');
  });

  // 逐个试解。码不对时 AES-GCM 认证失败，不会误判成别的码。
  async function lookup(code) {
    for (let k = 0; k < BLOBS.length; k++) {
      const payload = await decryptPayload(code, BLOBS[k]);
      if (payload) return payload;
    }
    return null;
  }

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    b.disabled = true;
    m.className = 'msg';
    try {
      const code = normalizeCode(i.value);
      if (!code) {
        m.className = 'msg bad show';
        m.textContent = '请输入完整的兑换码。';
        b.disabled = false;
        return;
      }
      const payload = await lookup(code);
      if (!payload) {
        m.className = 'msg bad show';
        m.textContent = '兑换码无效，请检查是否输入正确。';
        b.disabled = false;
        return;
      }
      if (payload.e && Date.now() > Date.parse(payload.e)) {
        m.className = 'msg bad show';
        m.textContent = '该链接已于 ' + payload.e + ' 过期。';
        b.disabled = false;
        return;
      }
      m.className = 'msg ok show';
      m.textContent = '兑换成功，点击下方按钮下载。';
      const a = document.createElement('a');
      a.className = 'dl';
      a.href = payload.u;
      a.rel = 'noreferrer';
      a.textContent = '开始下载';
      m.appendChild(a);
      i.disabled = true;
      b.textContent = '已兑换';
    } catch (err) {
      m.className = 'msg bad show';
      m.textContent = '处理失败，请刷新页面重试。';
      b.disabled = false;
    }
  });
})();
</script>
</body>
</html>
